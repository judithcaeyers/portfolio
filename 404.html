<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Verdwaald?</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Google Font: IM Fell English -->
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">

  <!-- Externe stylesheet -->
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      font-family: 'IM Fell English', serif;
      background-color: white;
      margin: 0;
      padding: 0 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.1rem;
      max-width: 600px;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .home-link {
      display: inline-block;
      color: black;
      text-decoration: none;
      background-color: #f3f3f3;
      padding: 1rem 2rem;
      border-radius: 2rem;
      font-size: 1rem;
      font-family: 'IM Fell English', serif;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .home-link:hover {
      background-color: #e0e0e0;
      color: #a3b2b3;
    }

    .home-link:active {
      color: #f98cfe;
    }
  </style>
</head>
<body>
  <h1>Hé, je bent verdwaald!</h1>
  <p>Deze pagina bestaat niet (meer). Maar geen paniek — je vindt de weg wel terug.</p>
  <a class="home-link" href="index.html">Ik wil naar huis!</a>
</body>
</html>
